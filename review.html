<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="robots" content="noindex" />
<title>냥박자 검토표</title>
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;600&display=swap">
<style>
:root { color-scheme: light; }
body { margin: 0; }
/* 레이아웃: 한 줄 세로 목록. 위에 요약, 항목마다 확인 방법 → 테스트 링크 → 적합/비적합 → 메모 */
:root {
  --bg: #ffffff;
  --surface: #f6f7f9;
  --line: #dfe2e7;
  --fg: #23262b;
  --muted: #646a73;
  --accent: #b8452c;
  --ok: #2f7d4f;
  --ok-bg: #e5f3ea;
  --bad: #b3261e;
  --bad-bg: #fbe7e5;
  --font-display: "Do Hyeon", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #15171a; --surface: #1e2125; --line: #33373d; --fg: #eceef1; --muted: #a2a8b1;
    --accent: #e0765c; --ok: #6cc892; --ok-bg: #173323; --bad: #f08a80; --bad-bg: #3a1d1a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #15171a; --surface: #1e2125; --line: #33373d; --fg: #eceef1; --muted: #a2a8b1;
  --accent: #e0765c; --ok: #6cc892; --ok-bg: #173323; --bad: #f08a80; --bad-bg: #3a1d1a; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 15px/1.6 var(--font-body); word-break: keep-all; }
.wrap { max-width: 720px; margin: 0 auto; padding-inline: 16px; padding-block: 28px 64px; display: grid; gap: 20px; }
h1 { font: 34px/1.15 var(--font-display); margin: 0; text-wrap: balance; }
.lead { margin: 0; color: var(--muted); }
.summary { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 14px; background: var(--surface); border-radius: 10px; font-variant-numeric: tabular-nums; }
.summary b { font-weight: 600; }
.summary .bad { color: var(--bad); }
.summary .ok { color: var(--ok); }
.save-state { margin-left: auto; color: var(--muted); font-size: 13px; }
.group-title { font: 22px/1.2 var(--font-display); margin: 12px 0 0; }
.item { border-top: 1px solid var(--line); padding-block: 16px 4px; display: grid; gap: 10px; }
.item h3 { margin: 0; font-size: 17px; font-weight: 600; }
.item p { margin: 0; }
.how { color: var(--muted); }
.links { display: flex; flex-wrap: wrap; gap: 8px; }
.links a { display: inline-flex; align-items: center; min-height: 36px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; color: var(--accent); text-decoration: none; font-weight: 600; font-size: 14px; }
.links a:hover { border-color: var(--accent); }
.verdict { display: flex; gap: 8px; }
.verdict button { flex: 1 1 0; min-height: 44px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: 600 15px var(--font-body); cursor: pointer; }
.verdict button[aria-pressed="true"].pass { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); }
.verdict button[aria-pressed="true"].fail { background: var(--bad-bg); border-color: var(--bad); color: var(--bad); }
.verdict button:focus-visible, .links a:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
textarea { width: 100%; box-sizing: border-box; min-height: 56px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--fg); font: 14px/1.5 var(--font-body); resize: vertical; }
.note-label { font-size: 13px; color: var(--muted); }
.tip { font-size: 13px; color: var(--muted); padding: 10px 12px; background: var(--surface); border-radius: 8px; }
</style>
  <script type="module" crossorigin src="./assets/review-YkTIcyuj.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-B5Qt9EMX.js">
</head>
<body>
<div class="wrap">
  <header style="display:grid;gap:8px">
    <h1>냥박자 검토표</h1>
    <p class="lead">링크를 휴대폰으로 열어 한 판씩 해 보고, 항목마다 적합·비적합을 눌러 주세요. 비적합이면 메모에 어떻게 바꾸면 좋을지 한 줄 남겨 주시면 그대로 고칩니다. 누르는 즉시 저장되고 Claude가 바로 읽습니다. 로그인은 필요 없어요.</p>
  </header>

  <div class="summary" aria-live="polite">
    <span>체크 <b id="sum-done">0</b> / <b id="sum-total">0</b></span>
    <span class="ok">적합 <b id="sum-pass">0</b></span>
    <span class="bad">비적합 <b id="sum-fail">0</b></span>
    <span class="save-state" id="save-state">불러오는 중…</span>
  </div>

  <p class="tip">소리는 이어폰이나 스피커로, 무음 모드는 끄고 들어 주세요. 링크는 바로 그 게임 소개 화면으로 열립니다(난이도가 미리 골라져 있어요).</p>

  <div id="list"></div>
</div>
</body>
</html>
